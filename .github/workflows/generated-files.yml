name: Generated files match the tree

on:
  push:
  pull_request:

# Checks only; nothing here pushes or publishes.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # index.json and the composed databases are what the apps fetch. If they
      # do not match the tree, an app updates to something nobody reviewed.
      - name: generator/build.py --check
        run: python3 generator/build.py --check
