name: Plugins index

# What every enginehost plugin repository has published, in one file that
# devices read from raw.githubusercontent.com. The same job also lists droidtop's
# own plugin repositories into droidtop-plugins/index.json (generator/
# droidtop_plugins_index.py), droidtop's official plugin catalog. GitHub's API allows an
# unauthenticated address 60 requests an hour; enginehost listing eleven
# repositories itself spent that in a few refreshes and showed an empty
# catalog. This job does the listing once, with a token.
on:
  schedule:
    # Four times a day, so a release published without a dispatch is in the
    # index within hours and `generatedAt` stays inside the window enginehost
    # trusts.
    - cron: "23 */6 * * *"
  # Each Droidtop plugin repository sends this after publishing a release
  # (plugins/README.md has the step). It names a repository to look at and
  # nothing else: what enters the index is what the generator verifies.
  repository_dispatch:
    types: [plugin-published]
  # A listed third-party maintainer cannot send a dispatch (that needs our
  # token); opening a "Register a third-party plugin repository" issue is
  # their way to ask for a run now instead of on the schedule. Acted on only
  # when the issue's author is the account the list names for that
  # repository.
  issues:
    types: [opened]
  workflow_dispatch:
  push:
    paths:
      - "plugins/**"
      - "droidtop-plugins/**"
      - ".github/workflows/plugins-index.yml"
      - "generator/plugins_index.py"
      - "generator/droidtop_plugins_index.py"
      - "generator/test_droidtop_plugins_index.py"
      - "generator/test_plugins_index.py"

# Read-only by default; the index job pushes plugins/index.json and
# plugins/origins.json and answers registration issues, so it alone gets
# write (Droidtop/enginehost docs/security/2026-09-24-ci-supply-chain.md,
# 2026-09-25-third-party-catalog.md).
permissions:
  contents: read

concurrency:
  group: plugins-index
  cancel-in-progress: false

jobs:
  index:
    # Issues other than the registration form are none of this job's business.
    if: ${{ github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'plugin-registration') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      ENGINEHOST_TOOLING: ${{ github.workspace }}/enginehost-tooling
    steps:
      # Keeps its credentials: the last step pushes the regenerated index.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Enginehost's format-v1 verifier and the signing root's public key it
      # pins (Droidtop/tracker#550), at a pinned commit: one implementation of
      # the check, the app's own tooling, and never a moving ref.
      - name: Check out Enginehost's signature tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Droidtop/enginehost
          ref: 419594b25cc704175e71879120444423b231d6d6
          path: enginehost-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts
            app/src/main/assets/trust

      - name: Signature tools
        run: python3 -m pip install --user --break-system-packages 'cryptography>=42'

      # A push that only touched these files says nothing about the plugin
      # repositories, so it checks the committed index instead of rebuilding
      # it: no API calls on an ordinary commit.
      - name: Check the committed index
        if: github.event_name == 'push'
        run: |
          python3 generator/plugins_index.py --check
          python3 generator/droidtop_plugins_index.py --check
          python3 -m unittest discover -s generator -p 'test_*.py' -v

      # Rebuild both indexes and push them. The rebuild reads the committed
      # index, origins and key history, so when main moved during the run the
      # push is refused and the rebuild runs again on the new main instead of
      # rebasing a commit made from stale files. A refused push once lost a
      # reindex until the next scheduled run (Droidtop/tracker#550).
      - name: Rebuild the indexes and push them
        if: github.event_name != 'push'
        env:
          # The default token reads public repositories. Set the
          # PLUGINS_INDEX_TOKEN secret if any plugin repository becomes
          # private.
          GH_TOKEN: ${{ secrets.PLUGINS_INDEX_TOKEN || github.token }}
        # --event reads the dispatch or issue from GITHUB_EVENT_PATH itself;
        # nothing a sender wrote is interpolated into this script.
        run: |
          set -euo pipefail
          git config user.name "droidtop-platforms"
          git config user.email "platforms@droidtop.invalid"
          for attempt in 1 2 3 4 5; do
            python3 generator/plugins_index.py --event --report "$RUNNER_TEMP/registration.md"
            # droidtop's own plugin repositories (Droidtop/droidtop-plugin-*), verified against
            # the droidtop root (manifest.jws). A registration issue concerns Enginehost's index only.
            if [ "$GITHUB_EVENT_NAME" != issues ]; then
              python3 generator/droidtop_plugins_index.py --build
            fi
            if git diff --quiet -- plugins/index.json plugins/origins.json && [ -z "$(git status --porcelain -- plugins/key-history.json plugins/envelopes droidtop-plugins/index.json)" ]; then
              echo "Nothing to commit."
              exit 0
            fi
            git add plugins/index.json plugins/origins.json plugins/key-history.json plugins/envelopes droidtop-plugins/index.json
            git commit -q -m "Plugins index: $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during the run (attempt $attempt); rebuilding on the new main."
            git fetch origin main
            git reset -q --hard origin/main
          done
          echo "::error::main kept moving; the index was not pushed" >&2
          exit 1

      - name: Answer the registration issue
        if: ${{ always() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/registration.md"
          [ -s "$report" ] || echo "- The run failed before it could say anything; see $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID." > "$report"
          gh issue comment "$ISSUE" --body-file "$report"
          gh issue close "$ISSUE"
